# ループを常駐させる。docker compose up -d で起動し、以降ターミナルは不要。
#
# ★ 重要: 必ずリポジトリのルートディレクトリから起動してください。
#   cd <リポジトリのルート>
#   docker compose -f docker/compose.yml up -d
# このファイル自体は docker/ の中にありますが、下の ${PWD} は「このファイルの
# 場所」ではなく「docker compose を実行したシェルのカレントディレクトリ」に
# 展開されます。docker/ の中から `cd docker && docker compose up -d` のように
# 実行すると、マウント先・working_dir・REPO_ROOT がホストの実際のリポジトリ
# パスとズレて起動に失敗します（entrypoint がエラーメッセージで検知はします
# が、そもそも迷わないようここに明記します）。
#
# ${PWD}:${PWD} でホストと同じ絶対パスにマウントしているのは意図的です。
# コンテナ内から docker compose を叩いたとき、ホストの Docker デーモンは
# ホスト側のパスしか解決できないため、パスを一致させる必要があります（DooD）。
#
# ★ 注意（重要）: docker.sock を渡すことは、このコンテナにホストの root 相当の
# 権限を与えることを意味します。コンテナ内のプロセスはホスト上の任意の
# コンテナを起動・停止・削除でき、事実上ホストを操作できます。
# これはローカル開発ツールとしての意図的な妥協です。信頼できないネットワーク
# や共有ホストでは使わないでください。
#
# オプトアウト: 自分のアプリが Docker を一切使わない場合は、下の volumes に
# ある次の2行（docker.sock のマウントと、直後のコメント1行）を削除すれば、
# このコンテナはホストの Docker を一切操作できなくなります:
#   - /var/run/docker.sock:/var/run/docker.sock
#   # ↑ 上の「★ 注意」参照: ホストの root 相当の権限をコンテナに渡す。...
services:
  loop:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${PWD}:${PWD}
      # ↑ DooD: ホストと同じ絶対パスでマウント（working_dir も同じ）
      - /var/run/docker.sock:/var/run/docker.sock
      # ↑ 上の「★ 注意」参照: ホストの root 相当の権限をコンテナに渡す。
      #   不要なら上のコメントブロックの「オプトアウト」を参照してこの2行を削除する
      - loop-claude-auth:/root/.claude
      - loop-gh-auth:/root/.config/gh
    working_dir: ${PWD}
    environment:
      - REPO_ROOT=${PWD}
      - TZ=${LOOP_TZ:-Asia/Tokyo}
      # Claude Code の設定ホームを、認証を入れている volume の中に向ける。
      #
      # 既定では認証などは ~/.claude（= volume の中）に入るが、~/.claude.json
      # だけが 1 階層上に置かれ、volume の外＝コンテナの書き込みレイヤに残る。
      # そのためコンテナを作り直すたびに消え、Maker/Verifier の実行ログの
      # 先頭に「Claude configuration file not found」が毎回混ざる。
      # ここを揃えると .claude.json も volume に入り、作り直しても残る。
      - CLAUDE_CONFIG_DIR=/root/.claude
    network_mode: host
    restart: unless-stopped

volumes:
  # name: を明示して、compose のプロジェクト名を接頭辞に付けさせない。
  #
  # 既定では docker_loop-claude-auth のようにプロジェクト名が前に付く。
  # すると .loop/config.toml の [docker] project_name を変えた瞬間に別の
  # volume を指すことになり、**claude と gh の認証が消えて再ログインになる**。
  # 認証はブラウザでの手作業が要る唯一の工程なので、プロジェクト名の変更で
  # 失われてはいけない。
  #
  # 結果としてホスト上の全ループが同じ認証を共有する。このテンプレートは
  # 個人が単独で所有するリポジトリ専用（loops/DECISIONS.md 2026-08-10）で、
  # どのループも同じ GitHub アカウントと Claude サブスクリプションを使うため、
  # 共有がむしろ正しい（1 回ログインすれば全ループに効く）。
  loop-claude-auth:
    name: loop-claude-auth
  loop-gh-auth:
    name: loop-gh-auth
