# テンプレート同期（P5）の所有境界。上から順に評価し、最初に一致したルールを適用する。
#
#   template = テンプレート所有。同期で常に上書きする
#   seeded   = テンプレートが初期版だけ置く。同期では絶対に触らない（新版があれば通知のみ）
#   user     = ユーザー所有。テンプレートは存在を関知しない

[[rules]]
kind = "seeded"
paths = [
  ".loop/config.toml",
  "docker/Dockerfile",
  "CLAUDE.md",
  # README.md は派生プロジェクト自身の説明になる。テンプレート所有にすると、
  # プロジェクトの README を書いた瞬間に同期がテンプレートの説明文で
  # 上書きして消す。CLAUDE.md と同じ「プロジェクト固有の文書」なので同じ扱い。
  # 2026-08-14 に template から移動（loops/DECISIONS.md 参照）
  "README.md",
  ".claude/settings.json",
]

[[rules]]
kind = "template"
paths = [
  ".loop/**",
  ".claude/skills/**",
  "docker/compose.yml",
  "docker/entrypoint.sh",
]

[[rules]]
kind = "user"
# "**" だけだと、多くの glob 実装は既定でドット始まりのパス要素に
# マッチしない（bash の globstar は dotglob 無効時に隠しファイルを
# 除外するのと同じ挙動）。".gitignore" や "loops/mtg/.gitkeep" のような
# ドット始まりのファイルを catch-all に確実に含めるため、明示的に加える
paths = ["**", ".*", "**/.*"]
